<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R1 shoulder tag screen test</title>
<style>
  html,body{margin:0;min-height:100%;background:#fff;color:#111;font:16px system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;box-sizing:border-box}
  #cards{display:flex;align-items:center;gap:2mm;width:max-content}
  .card{width:min(140mm,calc((100vw - 2mm)/2));height:auto;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;display:block;flex:none}
  #cards[data-mode="left"] .card,#cards[data-mode="right"] .card{width:min(140mm,95vw)}
  #cards[data-mode="left"] #right-card,#cards[data-mode="right"] #left-card{display:none}
  .controls{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;white-space:nowrap;background:#fffffff0;padding:5px;border-radius:7px}
  button{font:inherit;padding:5px 10px;border:1px solid #555;border-radius:6px;background:#eee;cursor:pointer}
  button.active{background:#cceef5}
  #note{position:fixed;top:4px;left:50%;transform:translateX(-50%);max-width:95vw;text-align:center;font-size:12px;line-height:1.2;background:#fffffff0;padding:3px 6px;border-radius:4px}
  #note.warn{color:#a32310;font-weight:700}
</style>
<div id="cards" data-mode="both">
  <img id="right-card" class="card" src="../Assets/Markers/Right%20Shoulder%20Tracking%20Card.png" alt="R1 right shoulder tracking card, AprilTag 36h11 ID 1">
  <img id="left-card" class="card" src="../Assets/Markers/Left%20Shoulder%20Tracking%20Card.png" alt="R1 left shoulder tracking card, AprilTag 36h11 ID 0">
</div>
<div id="note">Both tracking cards are visible. This side-by-side layout tests detection, not robot-space alignment.</div>
<div class="controls">
  <button id="both" class="active">Both</button>
  <button id="left">ID 0 only</button>
  <button id="right">ID 1 only</button>
  <button id="full">Full screen</button>
</div>
<script>
const cards=document.getElementById('cards');
const note=document.getElementById('note');
function checkFit(){
  const actualWidthPx=140*96/25.4;
  const smaller=document.getElementById('left-card').getBoundingClientRect().width<actualWidthPx-2;
  note.classList.toggle('warn',smaller);
  note.textContent=smaller
    ? 'Cards fit this window but are smaller than 14 cm. Detection test only; use printed cards on the robot for alignment.'
    : 'Cards are nominally 14 cm each. This side-by-side layout tests detection only; check physical size with a ruler.';
}
function choose(mode){
  cards.dataset.mode=mode;
  for(const id of ['both','left','right']) document.getElementById(id).classList.toggle('active',id===mode);
  checkFit();
}
for(const id of ['both','left','right']) document.getElementById(id).onclick=()=>choose(id);
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen();
window.addEventListener('resize',checkFit);
checkFit();
</script>
</html>
