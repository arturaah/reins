[project]
name = "reins-sim"
version = "0.1.0"
description = "MuJoCo simulation of the Unitree R1 for previewing planned trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
reins-preview = "reins_sim.preview:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reins_sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
